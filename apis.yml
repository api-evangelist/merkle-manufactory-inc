apis:
- name: Snapchain HTTP API
  description: >-
    The read/write REST interface a Snapchain node serves on port 3381 under the
    /v1 path. Read endpoints (casts, reactions, links, user data, verifications,
    fids, username proofs, storage limits, on-chain events, info, events) are
    unauthenticated; writes are performed by submitting protobuf-encoded,
    Ed25519-signed Farcaster messages to /v1/submitMessage. Snapchain is
    self-hosted node software (a drop-in replacement for Hubble); the default
    documented base address is a local node.
  humanURL: https://snapchain.farcaster.xyz/reference/httpapi/httpapi
  baseURL: http://127.0.0.1:3381/v1
