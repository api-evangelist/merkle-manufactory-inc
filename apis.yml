aid: merkle-manufactory-inc
name: Merkle Manufactory Inc.
description: >-
  Merkle Manufactory Inc. is the company that builds Farcaster, a sufficiently
  decentralized social network, and Snapchain, the blockchain-like peer-to-peer
  network that stores and syncs Farcaster's social data. Its developer surface
  is open and protocol-based rather than a single hosted product API: Snapchain
  nodes serve an HTTP API (port 3381, /v1) and a gRPC API (port 3383) for
  reading casts, reactions, links, user data, verifications and on-chain events
  and for submitting signed messages; Mini Apps (formerly Frames v2) run inside
  the Farcaster feed; and Sign In with Farcaster (SIWF) plus AuthKit provide
  identity for third-party apps. The stack is fully open source under the
  farcasterxyz GitHub organization. Backed by a16z.
